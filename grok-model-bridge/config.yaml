model_list:
  # Grok CLI session auth → cli-chat-proxy (primary)
  # Token loaded from ~/.grok/auth.json by scripts/start.sh
  - model_name: grok
    litellm_params:
      model: openai/grok-4.5
      api_base: https://cli-chat-proxy.grok.com/v1
      api_key: os.environ/GROK_SESSION_TOKEN
      extra_headers:
        X-XAI-Token-Auth: xai-grok-cli
        x-grok-client-version: "1.0.0"
        x-grok-model-override: grok-4.5
        User-Agent: grok-cli/1.0.0

  - model_name: grok-4.5
    litellm_params:
      model: openai/grok-4.5
      api_base: https://cli-chat-proxy.grok.com/v1
      api_key: os.environ/GROK_SESSION_TOKEN
      extra_headers:
        X-XAI-Token-Auth: xai-grok-cli
        x-grok-client-version: "1.0.0"
        x-grok-model-override: grok-4.5
        User-Agent: grok-cli/1.0.0

  # Anthropic Console API keys only (sk-ant-api…), NOT Claude Pro/Max OAuth.
  # OAuth from `claude login` is for Claude Code; Anthropic blocks using those
  # tokens from third-party OpenAI-compatible clients (including Grok Bot).
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
