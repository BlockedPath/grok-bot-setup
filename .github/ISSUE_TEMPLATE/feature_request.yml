name: Feature request
description: Suggest a new provider, flag, or CLI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction are you hitting?
      placeholder: I want to switch to provider X without manually writing env files…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the CLI behave?
      placeholder: |
        Add `adapters use foo` that…
        Flags: --model, --key, …
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or approaches you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New provider profile
        - Install / start / stop adapters
        - Interactive menu UX
        - Auth / login agents
        - Docs / README / help
        - npm packaging
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
